# SearXNG settings for BASTION doc-intelligence researcher
# Only JSON API enabled — no public-facing UI needed

use_default_settings: true

server:
  secret_key: "bastion-searxng-secret-change-in-prod"
  bind_address: "0.0.0.0"
  port: 8888
  limiter: false  # Internal use only, no rate limiting needed

search:
  safe_search: 0
  default_lang: "en"
  formats:
    - html
    - json

engines:
  - name: google
    engine: google
    shortcut: g
    disabled: false
  - name: bing
    engine: bing
    shortcut: b
    disabled: false
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
  - name: arxiv
    engine: arxiv
    shortcut: arx
    disabled: false

ui:
  static_use_hash: true

outgoing:
  request_timeout: 10
  max_request_timeout: 15
