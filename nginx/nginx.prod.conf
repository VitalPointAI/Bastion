# Host-level nginx for Bastion — TLS termination.
# Install to /etc/nginx/conf.d/bastion.conf.
# Replace ${DOMAIN} with actual domain (server-setup.sh does this automatically via sed).
# Run certbot --nginx to obtain certificates after installing this config.
#
# Architecture note:
#   - This host nginx terminates TLS on port 443
#   - Proxies all traffic to the frontend Docker container on port 8080
#   - Frontend container's nginx.conf handles SPA routing and /api/ proxy to backend:3001
#   - Databases (postgres:5432, neo4j:7474/7687) remain on Docker internal network only

# Conditionally set Connection header — 'upgrade' only for WebSocket requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name ${DOMAIN};

    # Let's Encrypt ACME challenge (needed before certbot obtains certificate)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    server_name ${DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Allow large file uploads (scenario documents up to 200MB)
    client_max_body_size 210m;

    # Proxy all traffic to frontend container (port 8080)
    # Frontend container's nginx handles SPA routing and /api/ proxy to backend
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;

        # SSE support (for channel feed events — keeps long-lived connections open)
        proxy_buffering off;
        proxy_read_timeout 86400;
    }
}
