# BASTION Development Environment
# docker-compose up -d to start all services
# docker-compose logs -f to view logs
# docker-compose down to stop

services:
  # ==========================================
  # PostgreSQL Database with TimescaleDB
  # ==========================================
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: bastion-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: coalition_ops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coalition_ops"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bastion-network

  # ==========================================
  # Neo4j Graph Database
  # ==========================================
  neo4j:
    image: neo4j:2025-community
    container_name: bastion-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bastion-network

  # ==========================================
  # Ironclaw PostgreSQL (pgvector) — isolated on ironclaw-network
  # ==========================================
  ironclaw-postgres:
    image: pgvector/pgvector:pg16
    container_name: bastion-ironclaw-postgres
    environment:
      POSTGRES_DB: ironclaw
      POSTGRES_USER: ironclaw
      POSTGRES_PASSWORD: ironclaw
    ports:
      - "5433:5432"   # Local debugging access (different host port)
    volumes:
      - ironclaw_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ironclaw -d ironclaw"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ironclaw-network

  # ==========================================
  # Ironclaw Agent Sidecar
  # Uncomment when ghcr.io/nearai/ironclaw image is published
  # ==========================================
  ironclaw:
    build:
      context: ./ironclaw
    container_name: bastion-ironclaw
    restart: unless-stopped
    ports:
      - "3333:8080"   # Local debugging access
    environment:
      # LLM backend — Anthropic via OAuth (subscription only, no API key fallback)
      LLM_BACKEND: anthropic
      ANTHROPIC_OAUTH_TOKEN: ${ANTHROPIC_OAUTH_TOKEN:-}
      ANTHROPIC_MODEL: claude-haiku-4-5-20251001
      # Database (ironclaw's own pgvector instance)
      DATABASE_URL: postgresql://ironclaw:ironclaw@ironclaw-postgres:5432/ironclaw
      # HTTP webhook server
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8080"
      HTTP_WEBHOOK_SECRET: ${IRONCLAW_SHARED_SECRET:-dev-shared-secret-change-me}
      # Secrets keychain master key (stable across restarts)
      IRONCLAW_SECRETS_MASTER_KEY: ${IRONCLAW_MASTER_KEY:-}
      # NEAR AI API key for embeddings
      NEARAI_API_KEY: ${NEARAI_API_KEY:-}
      # Agent settings
      AGENT_NAME: ironclaw
      AGENT_USE_PLANNING: "true"
      RUST_LOG: ironclaw=debug
      # Telegram bot token for /telegram pair command
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # MCP server URL — entrypoint registers this with Ironclaw's REPL at startup
      MCP_BASTION_URL: http://bastion-mcp:3334/mcp
    volumes:
      - ironclaw-data:/home/ironclaw/.ironclaw
      - token-sync:/shared/tokens    # OAuth token file from backend
    depends_on:
      ironclaw-postgres:
        condition: service_healthy
    networks:
      # Ironclaw is on a separate network — NO access to postgres or neo4j.
      # It can only communicate with the backend via the ironclaw-network.
      - ironclaw-network

  # ==========================================
  # SearXNG — Self-hosted meta-search engine for doc-intelligence researcher
  # ==========================================
  searxng:
    image: searxng/searxng:latest
    container_name: bastion-searxng
    restart: unless-stopped
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    ports:
      - "8888:8080"
    networks:
      - bastion-network

  # ==========================================
  # BASTION MCP Server
  # Exposes BASTION tools to AI agents via Model Context Protocol (SSE transport)
  # ==========================================
  bastion-mcp:
    build:
      context: ./backend
      target: runtime
    container_name: bastion-mcp
    command: node dist/mcp/index.js
    ports:
      - "3334:3334"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/coalition_ops
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - MCP_PORT=3334
      - MCP_SHARED_SECRET=${MCP_SHARED_SECRET:-dev-mcp-secret}
      - NODE_ENV=${NODE_ENV:-development}
      - SEARXNG_URL=http://searxng:8080
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3334/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - bastion-network
      - ironclaw-network
    restart: unless-stopped

  # ==========================================
  # Backend API Server
  # ==========================================
  backend:
    build:
      context: ./backend
      target: runtime
    container_name: bastion-backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      # These override env_file values for docker-compose networking
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/coalition_ops
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - IRONCLAW_URL=http://ironclaw:8080
      - IRONCLAW_VERSION=0.24.0
      - IRONCLAW_SHARED_SECRET=${IRONCLAW_SHARED_SECRET:-dev-shared-secret-change-me}
      - DATABASE_URL_IRONCLAW=postgresql://ironclaw:ironclaw@ironclaw-postgres:5432/ironclaw
      - MCP_BASTION_URL=http://bastion-mcp:3334/mcp
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - SEARXNG_URL=http://searxng:8080
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    volumes:
      - token-sync:/shared/tokens    # Write refreshed OAuth tokens for Ironclaw
      - ${HOME}/.claude:/home/nodejs/.claude:ro  # Claude Code OAuth credentials
    networks:
      - bastion-network
      # Backend bridges both networks: bastion-network (DB access) + ironclaw-network (agent access)
      - ironclaw-network
    restart: unless-stopped

  # ==========================================
  # Frontend Development Server (Vite)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: bastion-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://backend:3001
    env_file:
      - ./frontend/.env.local
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      # Mount source for hot reload
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      # Exclude node_modules from mount
      - /app/node_modules
    networks:
      - bastion-network
    restart: unless-stopped

networks:
  bastion-network:
    driver: bridge
  # Isolated network for Ironclaw agent — only the backend can reach it.
  # Ironclaw has NO access to postgres, neo4j, or any other bastion-network service.
  ironclaw-network:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  ironclaw_postgres_data:
  ironclaw-data:
  token-sync:       # Shared volume: backend writes OAuth tokens, Ironclaw reads them
