# BASTION Development Environment
# docker-compose up -d to start all services
# docker-compose logs -f to view logs
# docker-compose down to stop

services:
  # ==========================================
  # PostgreSQL Database with TimescaleDB
  # ==========================================
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: bastion-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: coalition_ops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coalition_ops"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bastion-network

  # ==========================================
  # Backend API Server
  # ==========================================
  backend:
    build:
      context: ./backend
      target: runtime
    container_name: bastion-backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      # These override env_file values for docker-compose networking
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/coalition_ops
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - bastion-network
    restart: unless-stopped

  # ==========================================
  # Frontend Development Server (Vite)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: bastion-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://localhost:3001
    env_file:
      - ./frontend/.env.local
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      # Mount source for hot reload
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      # Exclude node_modules from mount
      - /app/node_modules
    networks:
      - bastion-network
    restart: unless-stopped

networks:
  bastion-network:
    driver: bridge

volumes:
  postgres_data:
