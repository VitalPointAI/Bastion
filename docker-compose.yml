version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: coalition-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: coalition_ops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  backend:
    build: ./backend
    container_name: coalition-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/coalition_ops
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
    networks:
      - backend
    volumes:
      - ./backend/src:/app/src

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
