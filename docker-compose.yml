version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: coalition-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: coalition_ops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coalition_ops"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  backend:
    build: ./backend
    container_name: coalition-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/coalition_ops
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
    networks:
      - backend
    volumes:
      - ./backend/src:/app/src

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
