# Nginx configuration for docs.bastion.vitalpoint.ai
# Place in /etc/nginx/conf.d/ (this server uses conf.d/*.conf, not sites-enabled)
#
# Setup on server:
#   sudo mkdir -p /var/www/docs.bastion.vitalpoint.ai
#   sudo chown deploy:deploy /var/www/docs.bastion.vitalpoint.ai
#   sudo cp docs.bastion.conf /etc/nginx/conf.d/docs.bastion.conf
#   sudo certbot --nginx -d docs.bastion.vitalpoint.ai
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name docs.bastion.vitalpoint.ai;

    # Certbot will add HTTPS redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name docs.bastion.vitalpoint.ai;

    ssl_certificate /etc/letsencrypt/live/docs.bastion.vitalpoint.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.bastion.vitalpoint.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/docs.bastion.vitalpoint.ai;
    index index.html;

    # Docusaurus SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /img/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
}
