[package]
name = "funding-contract"
description = "NEAR funding contract for implicit account activation"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/vitalpointai/ssr"

[lib]
crate-type = ["cdylib", "rlib"]

# fields to configure build with WASM reproducibility
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.13.4-rust-1.85.1"
image_digest = "sha256:1f8b71742802f38990d442e8678aa4c0cd1c8317dd3ff493f41c079675d4f35b"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
]

[dependencies]
near-sdk = { version = "5.9", features = ["legacy"] }
borsh = "1.6"
schemars = "0.8"

[dev-dependencies]
near-sdk = { version = "5.9", features = ["unit-testing", "legacy"] }
# Note: near-workspaces requires newer Rust versions (1.88+), removed for compatibility
tokio = { version = "1.12.0", features = ["full"] }
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[package.metadata.near.build]
wasm_opt = false
